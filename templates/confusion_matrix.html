<!DOCTYPE html>
<html>
<head>
    <title>Confusion Matrix and ROC Curve</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .image-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confusion Matrix and ROC Curve</h1>
        <div class="image-container">
            <img src="data:image/png;base64, {{ imageBase64_cm }}" alt="Confusion Matrix">
            <img src="data:image/png;base64, {{ imageBase64_roc }}" alt="ROC Curve">
        </div>
    </div>
</body>
</html>
