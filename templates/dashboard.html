<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 10px 16px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        table.data-table, th, td {
            border: 1px solid #ddd;
        }
        select, button {
            padding: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            align-items: center; /* Vertically center align the items */
            gap: 10px; /* Creates a gap between items */
        }
        .form-group select, .form-group button {
            height: 40px; 
            padding: 0 10px;
}
        select, button {
            width: 200px; 
        }
    </style>
</head>
<body>
<div class="container">
    <h1>User Selection</h1>
    <p>Please select the user</p>
    <div class="form-group">
        <select id="userDropdown" onchange="fetchUserData()">
            <option value="">Select a User ID</option>
            {% for user_id in users %}
                <option value="{{ user_id }}">{{ user_id }}</option>
            {% endfor %}    
        </select>
        <button type="button" onclick="analyzeUser()">Analyze User</button>
    </div>
    <div id="loader" style="display: none; text-align: center;">
        <div class="spinner"></div>
    </div>
    
    <div id="userData">
        <!-- User-specific data will be displayed here -->
    </div>
</div>
<script>
function fetchUserData() {
    var userId = $('#userDropdown').val();
    if (!userId) {
        $('#userData').empty();
        $('#loader').hide(); 
        return;
    }
    $('#loader').show(); 
    $.ajax({
        url: '/fetch-user-data/' + userId,
        type: 'GET',
        success: function(response) {
            $('#userData').html(response);
            $('#loader').hide(); 
                },
        error: function() {
            console.log('Error fetching user data');
            $('#loader').hide(); 
        }
    });
}
function analyzeUser() {
    var userId = $('#userDropdown').val();
    if (userId) {
        window.location.href = `/analyze?userId=${userId}`; // Navigate to the analyze page with the user ID
    } else {
        alert('Please select a user ID.'); // Alert if no user is selected
    }
}
</script>
</body>
</html>
